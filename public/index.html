<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WP2PC Cloud</title><link rel="stylesheet" href="/style.css"></head><body>
<div class="wrap"><header><div><small>WP2PC CLOUD</small><h1>Backup Server</h1><p>Cloud backup and device connection control.</p></div><span id="status" class="pill">Checking…</span></header>
<section class="grid"><div class="card"><h2>Connection</h2><label>Room ID</label><div class="row"><input id="room"><button id="newRoom">New</button></div><button id="connect">Connect PC</button><button id="disconnect" class="secondary">Disconnect</button><pre id="log"></pre></div>
<div class="card"><h2>Cloud backups</h2><div class="row"><button id="refresh">Refresh</button><button id="backup" class="primary">Request Backup</button></div><div id="backups"></div></div></section></div><script src="/app.js"></script></body></html>
